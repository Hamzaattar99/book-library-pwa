<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرض الكتب</title>

  <!-- PWA: ربط ملف الـ manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#4a3f8f">

  <!-- أيقونة التطبيق -->
  <link rel="icon" href="icons/book-96.png">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>📚 معرض الكتب</h1>
    <button id="addBtn">+ أضف كتاب</button>
  </header>

  <!-- شبكة عرض الكتب -->
  <main id="booksGrid" class="grid"></main>

  <!-- نموذج إضافة كتاب (مخفي افتراضياً) -->
  <div id="formOverlay" class="overlay hidden">
    <form id="bookForm" class="form-card">
      <h2>كتاب جديد</h2>

      <label>عنوان الكتاب</label>
      <input type="text" id="titleInput" required>

      <label>اسم المؤلف</label>
      <input type="text" id="authorInput" required>

      <label>رابط صورة الغلاف (اختياري)</label>
      <input type="url" id="coverInput" placeholder="https://...">

      <div class="form-actions">
        <button type="submit">حفظ</button>
        <button type="button" id="cancelBtn">إلغاء</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
